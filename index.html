<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicago 13.1 — Training Plan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #07070e;
    --bg2: #0b0b18;
    --bg3: #0f0f20;
    --border: #161626;
    --border2: #1e1e32;
    --text: #e0e0f0;
    --muted: #444466;
    --dim: #222240;
    --accent: #4db8a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  .pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .pill {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }

  .pill span:first-child {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .pill span:last-child {
    color: #c0c0e0;
    font-weight: 500;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* Week tabs */
  .tabs {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--dim);
    padding: 12px 16px 10px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s;
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .tab-sub {
    font-size: 9px;
    color: var(--dim);
    margin-top: 2px;
  }

  .tab.active .tab-sub { color: var(--muted); }

  /* Week content */
  .week {
    display: none;
    padding: 16px;
  }

  .week.active { display: block; }

  .week-meta {
    margin-bottom: 14px;
  }

  .week-label {
    font-size: 14px;
    font-weight: bold;
    color: #c0c0e0;
    margin-bottom: 3px;
  }

  .week-dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #333366;
    margin-bottom: 5px;
  }

  .week-focus {
    font-size: 12px;
    color: #555577;
    font-style: italic;
  }

  /* Day rows */
  .day {
    margin-bottom: 4px;
  }

  .day-btn {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .day-btn.open {
    border-radius: 8px 8px 0 0;
  }

  .day-btn:active { opacity: 0.8; }

  .day-date {
    flex-shrink: 0;
    width: 36px;
  }

  .day-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .day-date-str {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--dim);
  }

  .day-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .day-label-text {
    flex: 1;
    font-size: 13px;
    font-family: 'Georgia', serif;
    color: #c0c0e0;
  }

  .day-label-text.rest-label { color: #2a2a44; }

  .day-miles {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .day-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 4px;
    padding: 2px 7px;
  }

  /* Status backgrounds — matches JSX exactly */
  .status-done     { background: #0a1a12 !important; border-color: #1f4a2a !important; }
  .status-key      { background: #1a1500 !important; border-color: #3a2e00 !important; }
  .status-rest     { background: #08080f !important; border-color: #111122 !important; }
  .status-race     { background: #1a0808 !important; border-color: #5a1515 !important; }
  .status-upcoming { background: #0b0b18 !important; border-color: #161626 !important; }
  .status-optional { background: #0c0c1a !important; border-color: #222238 !important; }

  /* Detail panel */
  .day-detail {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-top: 1px solid var(--border2);
    border-radius: 0 0 8px 8px;
    padding: 10px 12px 14px;
    display: none;
  }

  .day-detail.open { display: block; }

  .detail-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #8080a0;
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .detail-note {
    display: flex;
    gap: 10px;
  }

  .note-bar {
    width: 2px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .note-text {
    font-size: 12px;
    color: #555577;
    line-height: 1.6;
    font-style: italic;
  }

  /* Progression panel */
  .progression {
    margin-top: 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .prog-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .prog-tracks {
    display: flex;
    gap: 8px;
  }

  .prog-track {
    flex: 1;
    min-width: 0;
  }

  .prog-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    margin-bottom: 6px;
  }

  .prog-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    margin-bottom: 3px;
    padding-left: 0;
    border-left: 2px solid transparent;
    padding-left: 0;
    transition: color 0.15s;
  }

  .prog-item.current {
    color: #c0c0e0;
    font-weight: 500;
    padding-left: 8px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .loading-dot {
    animation: pulse 1.2s infinite;
    display: inline-block;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* Countdown */
  .countdown {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .countdown span {
    color: var(--accent);
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-label" id="race-date-label">Loading...</div>
  <h1 id="race-name">Training Plan</h1>
  <div class="pills" id="pills"></div>
  <div class="countdown" id="countdown"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div>🏃 Easy</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4db8a0"></div>🌊 Moderate</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e05555"></div>⚡ Intervals</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e07a35"></div>🔥 Threshold</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f6c90e"></div>🏆 Race/Trial</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
    <button onclick="loadPlan(true)" style="
      background:none;border:1px solid var(--border2);border-radius:6px;
      color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:10px;
      letter-spacing:0.1em;padding:5px 12px;cursor:pointer;
      text-transform:uppercase;">↻ Refresh Plan</button>
    <span id="refresh-status" style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)"></span>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div id="weeks-container"><div class="loading"><span class="loading-dot">●</span> Loading plan...</div></div>

<script>
const DIRECT_GIST_URL = "https://gist.githubusercontent.com/mowbotrobot/6e6293bc31fa5dcd2e08c0c14fbccba4/raw/training_plan.json";
const PROXY_GIST_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(DIRECT_GIST_URL);
const PROXY2_GIST_URL = "https://corsproxy.io/?" + encodeURIComponent(DIRECT_GIST_URL);

async function fetchGistWithFallback() {
  const attempts = [DIRECT_GIST_URL, PROXY_GIST_URL, PROXY2_GIST_URL];
  let lastError = null;
  for (const url of attempts) {
    try {
      const r = await fetch(url + (url.includes('?') ? '&' : '?') + "t=" + Date.now());
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      return data;
    } catch (e) {
      lastError = e;
      continue;
    }
  }
  throw lastError || new Error("All fetch attempts failed");
}

const TYPE_COLORS = {
  easy:      { color:"#4a90d9", emoji:"🏃" },
  moderate:  { color:"#4db8a0", emoji:"🌊" },
  intervals: { color:"#e05555", emoji:"⚡" },
  threshold: { color:"#e07a35", emoji:"🔥" },
  trial:     { color:"#f6c90e", emoji:"🏁" },
  race:      { color:"#d45a5a", emoji:"🏆" },
  rest:      { color:"#1e1e30", emoji:"😴" }
};

const STATUS_STYLES = {
  done:     { bg: "#0a1a12", border: "#1f4a2a", badge: "Done" },
  key:      { bg: "#1a1500", border: "#3a2e00", badge: "Key" },
  upcoming: { bg: "#0b0b18", border: "#161626", badge: "" },
  rest:     { bg: "#08080f", border: "#111122", badge: "" },
  race:     { bg: "#1a0808", border: "#5a1515", badge: "Race Day" },
  optional: { bg: "#0c0c1a", border: "#222238", badge: "Optional" },
};

const PROGRESSIONS = [
  ["Intervals", "#e05555", [
    "Wk1: Recovery", "Wk2: 5×1000m @ 6:05/mi",
    "Wk3: 4×1mi @ 6:05–6:10/mi", "Wk4: 3×2mi cruise @ HM pace",
    "Wk5: 3×1mi sharp", "Wk6: 4×400m tune-up"
  ]],
  ["Threshold", "#e07a35", [
    "Wk1: 15 min @ 6:52/mi", "Wk2: 20 min continuous",
    "Wk3: 25 min continuous", "Wk4: 30 min — peak",
    "Wk5: 20 min (taper)", "—"
  ]],
  ["Long Run", "#4db8a0", [
    "Wk1: Knee recovery", "Wk2: 6 mi easy",
    "Wk3: 10K or 11 mi tempo", "Wk4: 12 mi w/ 4 @ HM pace",
    "Wk5: 8 mi easy", "Race Day"
  ]]
];

const CACHE_KEY = 'training_plan_cache';

let plan = null;
let openDay = null;

function renderFromPlan() {
  renderHeader();
  renderTabs();
  renderWeeks();
  selectDefaultWeek();
}

async function loadPlan(forceRefresh = false) {
  // Try cache first unless forcing refresh
  if (!forceRefresh) {
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        plan = JSON.parse(cached);
        renderFromPlan();
        document.getElementById("loading").style.display = "none";
        document.getElementById("main").style.display = "block";
        updateRefreshStatus("Loaded from cache");
        return;
      }
    } catch(e) {}
  }

  // Fetch from Gist
  updateRefreshStatus("Fetching latest plan...");
  try {
    plan = await fetchGistWithFallback();
    localStorage.setItem(CACHE_KEY, JSON.stringify(plan));
    renderFromPlan();
    document.getElementById("loading").style.display = "none";
    document.getElementById("main").style.display = "block";
    updateRefreshStatus("Updated " + new Date().toLocaleTimeString());
  } catch(e) {
    if (plan) {
      updateRefreshStatus("Fetch failed — showing cached plan");
    } else {
      document.getElementById("weeks-container").innerHTML =
        '<div class="loading">Failed to load plan. Check connection.</div>';
      updateRefreshStatus("Failed to load");
    }
  }
}

function updateRefreshStatus(msg) {
  const el = document.getElementById("refresh-status");
  if (el) el.textContent = msg;
}

function renderHeader() {
  const race = plan.race;
  document.getElementById("race-name").textContent = race.name;

  const raceDate = new Date(race.date + "T12:00:00");
  document.getElementById("race-date-label").textContent =
    raceDate.toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"}) + " · Chicago";

  const pills = document.getElementById("pills");
  const items = [
    ["Goal", race.goals.primary || race.goals.conservative || "—"],
    ["Pace", race.pace],
  ];
  pills.innerHTML = items.map(([k,v]) => `
    <div class="pill">
      <span>${k}</span><span>${v}</span>
    </div>`).join("");

  const today = new Date();
  const diff = Math.ceil((raceDate - today) / (1000*60*60*24));
  const cdEl = document.getElementById("countdown");
  if (diff > 0) {
    cdEl.innerHTML = `<span>${diff}</span> days to race`;
  } else if (diff === 0) {
    cdEl.innerHTML = `<span>Race day!</span>`;
  } else {
    cdEl.innerHTML = `Race was <span>${Math.abs(diff)}</span> days ago`;
  }
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  const total = plan.weeks.length;
  tabs.innerHTML = plan.weeks.map((w, i) => {
    const weeksToGoal = total - i; // counts down: 18, 17, ... 1 (race week = 1, shown as "Race Wk")
    const label = i === total - 1 ? "Race Wk" : weeksToGoal + " wks";
    return `
    <button class="tab" data-week="${i}" onclick="selectWeek(${i})">
      ${label}
      <div class="tab-sub">${w.miles || ""}</div>
    </button>`;
  }).join("");
}

function renderWeeks() {
  const container = document.getElementById("weeks-container");
  container.innerHTML = plan.weeks.map((week, wi) => `
    <div class="week" id="week-${wi}">
      <div class="week-meta">
        <div class="week-label">${week.label}</div>
        <div class="week-dates">${week.dates} · ${week.miles || ""}</div>
        <div class="week-focus">${week.focus || ""}</div>
      </div>
      ${week.days.map((d, di) => renderDay(d, wi, di)).join("")}
    </div>`).join("");
}

function renderDay(d, wi, di) {
  const color = TYPE_COLORS[d.type]?.color || "#555";
  const emoji = TYPE_COLORS[d.type]?.emoji || "";
  const status = d.status || (d.type === "rest" ? "rest" : "upcoming");
  const ss = STATUS_STYLES[status] || STATUS_STYLES.upcoming;
  const isRest = d.type === "rest";
  const dt = new Date(d.date + "T12:00:00");
  const dayName = dt.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase();
  const dateStr = dt.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const badge = ss.badge;

  const btnStyle = `background:${ss.bg};border:1px solid ${ss.border};border-radius:8px;padding:10px 12px;width:100%;cursor:${isRest?'default':'pointer'};text-align:left;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent;`;
  const detailStyle = `background:${ss.bg};border:1px solid ${color}44;border-top:1px solid ${ss.border};border-radius:0 0 8px 8px;padding:10px 12px 14px;display:none;`;

  return `
    <div class="day" id="day-${wi}-${di}">
      <button style="${btnStyle}" id="btn-${wi}-${di}" onclick="${isRest ? '' : `toggleDay(${wi},${di})`}">
        <div class="day-date">
          <div class="day-name">${dayName}</div>
          <div class="day-date-str">${dateStr}</div>
        </div>
        <div class="day-dot" style="background:${color};opacity:${isRest?0.2:1}"></div>
        <div class="day-label-text ${isRest?'rest-label':''}">
          ${emoji ? `${emoji} ` : ""}${d.label}
        </div>
        ${d.miles > 0 ? `<div class="day-miles">${d.miles} mi</div>` : ""}
        ${badge ? `<div class="day-badge" style="color:${color};background:${color}18;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;border-radius:4px;padding:2px 7px;">${badge}</div>` : ""}
      </button>
      <div style="${detailStyle}" id="detail-${wi}-${di}">
        <div class="detail-text">${d.detail || ""}</div>
        ${d.note ? `<div class="detail-note">
          <div class="note-bar" style="background:${color}"></div>
          <div class="note-text">${d.note}</div>
        </div>` : ""}
      </div>
    </div>`;
}

function renderProgression(wi) {
  return `<div class="progression">
    <div class="prog-label">Progression Targets</div>
    <div class="prog-tracks">
      ${PROGRESSIONS.map(([title, color, items]) => `
        <div class="prog-track">
          <div class="prog-title" style="color:${color}">${title}</div>
          ${items.map((item, i) => `
            <div class="prog-item ${i===wi?'current':''}"
              style="${i===wi?`border-left-color:${color}`:''}">
              ${item}
            </div>`).join("")}
        </div>`).join("")}
    </div>
  </div>`;
}

function toggleDay(wi, di) {
  const key = `${wi}-${di}`;
  const detailEl = document.getElementById(`detail-${wi}-${di}`);
  const btnEl = document.getElementById(`btn-${wi}-${di}`);
  const color = TYPE_COLORS[plan.weeks[wi].days[di].type]?.color || "#555";

  if (openDay === key) {
    detailEl.style.display = "none";
    btnEl.style.borderRadius = "8px";
    openDay = null;
  } else {
    if (openDay) {
      const [pwi, pdi] = openDay.split("-");
      const pd = document.getElementById(`detail-${openDay}`);
      const pb = document.getElementById(`btn-${openDay}`);
      if (pd) pd.style.display = "none";
      if (pb) pb.style.borderRadius = "8px";
    }
    detailEl.style.display = "block";
    btnEl.style.borderRadius = "8px 8px 0 0";
    btnEl.style.borderColor = color + "55";
    openDay = key;
  }
}

function selectWeek(i) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".week").forEach(w => w.classList.remove("active"));
  document.querySelector(`.tab[data-week="${i}"]`).classList.add("active");
  document.getElementById(`week-${i}`).classList.add("active");
  openDay = null;
}

function selectDefaultWeek() {
  const today = new Date();
  let bestWeek = 0;
  plan.weeks.forEach((week, i) => {
    const firstDay = week.days.find(d => d.date);
    if (firstDay) {
      const d = new Date(firstDay.date + "T12:00:00");
      if (d <= today) bestWeek = i;
    }
  });
  selectWeek(bestWeek);
}

loadPlan();
</script>
</body>
</html>
